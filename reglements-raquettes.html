<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Règles essentielles EPS</title><style>body{margin:0;background:#eef4f0;font:17px system-ui;color:#173c35}header{background:#173c35;color:white;padding:22px}h1{margin:0 0 12px}select,button{font:inherit;padding:10px;border-radius:9px}main{max-width:1200px;margin:auto;padding:20px}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}article{background:white;border-radius:14px;overflow:hidden;border:1px solid #d6e1d6}h2{margin:0;background:#28796a;color:white;padding:14px;font-size:18px}li{margin:12px 7px;line-height:1.5}footer{padding:20px;text-align:center}@media(max-width:800px){#cards{grid-template-columns:1fr}}@media print{header select,header button{display:none}#cards{grid-template-columns:repeat(2,1fr)}} </style><header><h1 id="title">RÈGLES ESSENTIELLES · EPS</h1><select id="sport"><option value="badminton">🏸 Badminton</option><option value="pickleball">🏓 Pickleball</option></select> <button onclick="window.print()">Imprimer / PDF</button></header><main><div id="cards"></div></main><footer id="foot"></footer><script>
const sets={
badminton:{title:"🏸 BADMINTON",foot:"Volant sur la ligne = BON. Service toujours en diagonale.",blocks:[
["LE SERVICE","Servir en diagonale, vers le carré opposé.","Frapper le volant sous 1,15 m (règle officielle).","Droite si le score du serveur est pair, gauche s’il est impair."],
["FILET ET LIGNES","Un volant sur la ligne est bon.","Le volant peut toucher le filet puis passer, y compris au service.","Le volant doit passer dans le terrain adverse."],
["LES FAUTES","Volant dehors ou au sol de son côté.","Toucher le filet pendant l’échange.","Frapper deux fois le volant ou le porter sur la raquette."],
["SIMPLE ET DOUBLE","En simple, couloirs latéraux exclus.","En double, couloirs latéraux inclus.","Au service en double, la ligne intérieure de fond limite la zone valable."],
["LES POINTS","Chaque échange gagné vaut un point.","Set à 21 points, avec deux points d’écart.","À 29–29, le point suivant gagne le set."],
["FAIR-PLAY","Annoncer le score.","Respecter les décisions et les autres joueurs.","Se saluer en fin de match."]]},
pickleball:{title:"🏓 PICKLEBALL",foot:"Deux rebonds obligatoires au début de l’échange ; pas de volée dans la kitchen.",blocks:[
["LE SERVICE","Servir derrière la ligne de fond, en diagonale.","La balle doit dépasser la zone de non-volée (kitchen).","Service frappé : mouvement ascendant et contact sous la taille ; service après rebond autorisé."],
["DEUX REBONDS","Le receveur laisse rebondir le service.","Le serveur laisse rebondir le retour.","Ensuite, les volées sont autorisées hors de la kitchen."],
["LA KITCHEN","Pas de volée dans cette zone, ni en touchant sa ligne.","On peut y entrer pour jouer une balle après rebond.","L’élan après une volée ne doit pas nous y entraîner."],
["LES FAUTES","Balle dehors ou deux rebonds.","Service dans la kitchen ou sur sa ligne.","Toucher le filet ou faire une volée depuis la kitchen."],
["LES POINTS","En décompte classique, seul le camp au service marque.","Manche généralement en 11 points avec deux points d’écart.","En double, deux serveurs successifs par équipe, sauf au premier tour."],
["FAIR-PLAY","Annoncer le score avant le service.","Respecter partenaires et adversaires.","En EPS, préciser la variante de score utilisée."]]}};
function render(){const d=sets[document.getElementById("sport").value];document.getElementById("title").textContent=d.title+" — RÈGLES ESSENTIELLES";document.getElementById("cards").innerHTML=d.blocks.map((b,i)=>"<article><h2>"+String(i+1).padStart(2,"0")+" · "+b[0]+"</h2><ul>"+b.slice(1).map(x=>"<li>"+x+"</li>").join("")+"</ul></article>").join("");document.getElementById("foot").textContent=d.foot}document.getElementById("sport").onchange=render;render();
</script></html>
